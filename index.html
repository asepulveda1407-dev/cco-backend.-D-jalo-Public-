<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CCO Intelligence</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f7fa; color: #1f2937; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .login-container { max-width: 500px; margin: 60px auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .login-container h1 { text-align: center; margin-bottom: 30px; color: #001c2d; font-size: 1.8em; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; color: #374151; font-weight: 500; }
    .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 1em; }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: #0066cc; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 1em; font-weight: 600; cursor: pointer; }
    .btn-primary { background: #0066cc; color: white; }
    .btn-primary:hover { background: #0052a3; }
    .error { background: #fee2e2; color: #dc2626; padding: 15px; border-radius: 6px; margin-bottom: 15px; }
    .success { background: #dbeafe; color: #0c4a6e; padding: 15px; border-radius: 6px; margin-bottom: 15px; }
    .app { display: none; }
    .section { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; }
    .section h2 { margin-bottom: 15px; color: #001c2d; font-size: 1.5em; }
    .file-group { margin-bottom: 20px; }
    .file-group label { display: block; margin-bottom: 10px; color: #374151; font-weight: 500; }
    .file-group input { display: none; }
    .file-label { display: inline-block; padding: 10px 20px; background: #e5e7eb; border-radius: 6px; cursor: pointer; }
    .buttons { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
    .buttons .btn { flex: 1; min-width: 150px; }
    .btn-secondary { background: #10b981; color: white; }
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin: 20px 0; }
    .kpi-card { background: #f9fafb; padding: 20px; border-radius: 6px; border-left: 4px solid #0066cc; }
    .kpi-value { font-size: 2.5em; font-weight: 700; color: #001c2d; margin-top: 10px; }
    .ranking-item { display: flex; justify-content: space-between; padding: 15px; background: #f9fafb; border-radius: 6px; margin-bottom: 10px; }
    .ranking-value { color: #0066cc; font-weight: 700; }
  </style>
</head>
<body>

<div id="loginSection" class="login-container">
  <h1>CCO Intelligence</h1>
  <div id="errorMessage"></div>
  <div class="form-group">
    <label>URL del Backend</label>
    <input type="text" id="apiUrl" value="https://cco-backend-d-jalo-public.onrender.com">
  </div>
  <div class="form-group">
    <label>Nombre</label>
    <input type="text" id="userName" value="Alberto Sepúlveda">
  </div>
  <div class="form-group">
    <label>Rol</label>
    <select id="userRole">
      <option value="supervisor_nacional">Supervisor Nacional</option>
      <option value="gerencia">Gerencia</option>
    </select>
  </div>
  <button class="btn btn-primary" onclick="handleLogin()">Entrar</button>
</div>

<div id="appSection" class="app">
  <div class="container">
    <h1 style="text-align:center; margin-bottom:30px; color:#001c2d;">CCO Intelligence</h1>
    <p style="text-align:center; color:#6b7280; margin-bottom:30px;" id="userInfo"></p>
    <div class="section">
      <h2>Cargar Datos</h2>
      <div class="file-group">
        <label>Turnos</label>
        <input type="file" id="fileTurnos" accept=".xlsx,.xls" onchange="uploadFile(event, 'turnos')">
        <label for="fileTurnos" class="file-label">Seleccionar archivo</label>
        <span id="turnos-status"></span>
      </div>
      <div class="file-group">
        <label>Citaciones</label>
        <input type="file" id="fileCitaciones" accept=".xlsx,.xls" onchange="uploadFile(event, 'citaciones')">
        <label for="fileCitaciones" class="file-label">Seleccionar archivo</label>
        <span id="citaciones-status"></span>
      </div>
      <div class="file-group">
        <label>Logeo</label>
        <input type="file" id="fileLogeo" accept=".xlsx,.xls" onchange="uploadFile(event, 'logeo')">
        <label for="fileLogeo" class="file-label">Seleccionar archivo</label>
        <span id="logeo-status"></span>
      </div>
      <div class="buttons">
        <button class="btn btn-primary" onclick="generateReport()">Generar Reporte</button>
        <button class="btn btn-secondary" onclick="logout()">Salir</button>
      </div>
    </div>
    <div id="reportSection" class="section" style="display:none;">
      <h2>Reporte Ejecutivo</h2>
      <div id="reportContent"></div>
    </div>
  </div>
</div>

<script>
let apiUrl = '';

function handleLogin() {
  apiUrl = document.getElementById('apiUrl').value.trim();
  const userName = document.getElementById('userName').value.trim();
  const userRole = document.getElementById('userRole').value;
  const errorDiv = document.getElementById('errorMessage');
  
  if (!apiUrl || !userName) {
    errorDiv.innerHTML = '<div class="error">Completa todos los campos</div>';
    return;
  }
  
  fetch(`${apiUrl}/health`)
    .then(r => r.json())
    .then(data => {
      if (data.ok) {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('appSection').style.display = 'block';
        document.getElementById('userInfo').textContent = `${userName} · ${userRole}`;
      } else {
        throw new Error('Backend no respondió');
      }
    })
    .catch(err => {
      errorDiv.innerHTML = `<div class="error">Error: ${err.message}</div>`;
    });
}

function uploadFile(event, tipo) {
  const file = event.target.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const workbook = XLSX.read(e.target.result, { type: 'array' });
      const sheet = workbook.Sheets[workbook.SheetNames[0]];
      const datos = XLSX.utils.sheet_to_json(sheet);
      
      fetch(`${apiUrl}/api/ingesta`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tipo, datos })
      })
        .then(r => r.json())
        .then(data => {
          if (data.ok || data.success) {
            document.getElementById(`${tipo}-status`).textContent = `✅ ${datos.length} registros`;
          } else {
            document.getElementById(`${tipo}-status`).textContent = `❌ ${data.error}`;
          }
        });
    } catch (err) {
      alert(`Error: ${err.message}`);
    }
  };
  reader.readAsArrayBuffer(file);
}

function generateReport() {
  const reportSection = document.getElementById('reportSection');
  const reportContent = document.getElementById('reportContent');
  reportContent.innerHTML = '<div class="success">Generando reporte...</div>';
  reportSection.style.display = 'block';
  
  fetch(`${apiUrl}/api/reporte`)
    .then(r => r.json())
    .then(data => {
      let html = '<h3>Resumen Ejecutivo</h3>';
      html += '<div class="kpi-grid">';
      html += `<div class="kpi-card"><div>Operadores</div><div class="kpi-value">${data.resumen.totalTurnos}</div></div>`;
      html += `<div class="kpi-card"><div>Con Logeo</div><div class="kpi-value">${data.resumen.totalLogeos}</div></div>`;
      html += `<div class="kpi-card"><div>Adherencia</div><div class="kpi-value">${data.resumen.adherencia}%</div></div>`;
      html += '</div>';
      html += '<h3>Top 5 Operadores</h3>';
      data.ranking.forEach(r => {
        html += `<div class="ranking-item"><div><strong>${r.nombre}</strong><br><small>${r.planta}</small></div><div class="ranking-value">${r.adelanto} min</div></div>`;
      });
      reportContent.innerHTML = html;
    })
    .catch(err => {
      reportContent.innerHTML = `<div class="error">Error: ${err.message}</div>`;
    });
}

function logout() {
  document.getElementById('appSection').style.display = 'none';
  document.getElementById('loginSection').style.display = 'block';
  apiUrl = '';
}
</script>

</body>
</html>
